name: dreadmoor
description: "Dreadmoor: Rebecca Stone Mystery"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Routing
  cupertino_icons: ^1.0.8
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  intl: ^0.20.2

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod: ^3.2.1

  # Database / Persistence
  drift: ^2.32.0
  sqlite3: ^3.1.7
  sqlite3_flutter_libs: ^0.6.0+eol
  sqlite3_web: ^0.6.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Utilities
  collection: ^1.18.0

  # Stream operators
  rxdart: ^0.28.0

  # Media
  lottie: ^3.3.2
  video_player: ^2.11.1
  chewie: ^1.13.0
  image_picker: ^1.1.2

  # Audio
  audioplayers: ^6.0.0

  # JSON / Models
  json_annotation: ^4.11.0
  hooks_riverpod: ^3.3.1
  flame: ^1.36.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.12.2
  drift_dev: ^2.32.0
  json_serializable: ^6.11.2
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0a0a0a"
  adaptive_icon_foreground: "assets/icon/icon.png"


flutter:
  uses-material-design: true

  assets:

    # Branding / UI
    - assets/branding/
    - assets/backgrounds/
    - assets/ui/
    - assets/ui/quill_red.png
    - assets/ui/quill_black.png
    - assets/characters/
    - assets/map/
    - assets/map/locations/
    - assets/icon/
    - assets/music/

    # Media
    - assets/media/images/
    - assets/media/videos/
    - assets/media/audio/
    - assets/media/sfx/
    - assets/media/headers/

    # Episodes (auto-load all episode json files)
    - assets/story/ep01/
    - assets/story/ep01/diary/

  fonts:
    - family: NoirDisplay
      fonts:
        - asset: assets/fonts/noir_display.ttf

    - family: MonoGlitch
      fonts:
        - asset: assets/fonts/mono_glitch.ttf
