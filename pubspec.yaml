name: dreadmoor
description: "Dreadmoor: Rebecca Stone Mystery"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  drift: ^2.24.2
  sqlite3: ^2.1.0
  sqlite3_flutter_libs: ^0.5.24
  sqlite3_web: ^0.4.1
  go_router: ^17.1.0
  lottie: ^3.3.2
  google_fonts: ^8.0.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  drift_dev: ^2.31.0
  json_serializable: ^6.11.2
  flutter_launcher_icons: ^0.14.4

# ⬇️ THE FIX FOR YOUR BUILD ERROR ⬇️
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false # This stops the tool from looking for the missing iOS folder
  image_path: "assets/icon/icon.png" # Path to your icon file
  adaptive_icon_background: "#0a0a0a" # Noir theme background
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/backgrounds/
    - assets/ui/
    - assets/characters/
    - assets/map/
    - assets/map/locations/
    - assets/icon/
    - content/episodes/ep01/
    - content/episodes/ep01/threads/
