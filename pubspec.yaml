name: dreadmoor
description: "Dreadmoor: Rebecca Stone Mystery"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Routing
  cupertino_icons: ^1.0.8
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  intl: ^0.20.2

  # State
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1

  # DB / Persistence
  drift: ^2.24.2
  sqlite3: ^2.1.0
  sqlite3_flutter_libs: ^0.5.24
  sqlite3_web: ^0.4.1
  path_provider: ^2.1.5
  path: ^1.9.1

  # Media
  lottie: ^3.3.2
  video_player: ^2.11.0
  chewie: ^1.13.0

  # JSON / Models
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  drift_dev: ^2.31.0
  json_serializable: ^6.11.2
  flutter_launcher_icons: ^0.14.4

# 🔧 Launcher Icon Config
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0a0a0a" # Noir background
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  # 🎨 Assets (Future-proofed for episodes)
  assets:
    - assets/branding/
    - assets/backgrounds/
    - assets/ui/
    - assets/characters/
    - assets/map/
    - assets/map/locations/
    - assets/icon/

    # Content pipeline (episodes)
    - content/episodes/ep01/
    - content/episodes/ep01/threads/
    - content/episodes/ep01/diary/
    - content/episodes/ep01/evidence/
    - content/episodes/ep01/intercepts/
    - content/episodes/ep01/locations/
    - content/episodes/ep01/recaps/

    # Pre-register future episodes so you never edit pubspec again
    - content/episodes/ep02/
    - content/episodes/ep03/
    - content/episodes/ep04/
    - content/episodes/ep05/

  # 🅰️ Fonts (optional but recommended for noir UI)
  fonts:
    - family: NoirDisplay
      fonts:
        - asset: assets/fonts/noir_display.ttf
    - family: MonoGlitch
      fonts:
        - asset: assets/fonts/mono_glitch.ttf
