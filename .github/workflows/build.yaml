name: Build Android

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - 'Production_Dreadmoor'
  pull_request:
    branches:
      - 'Production_Dreadmoor'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons (Android only)
        # Patch the config to android-only BEFORE running, so iOS absence doesn't matter
        run: |
          dart run flutter_launcher_icons -f <(python3 -c "
          import yaml, sys
          with open('pubspec.yaml') as f:
              data = yaml.safe_load(f)
          cfg = data.get('flutter_launcher_icons', {})
          cfg['ios'] = False
          print(yaml.dump({'flutter_launcher_icons': cfg}))
          ")
        continue-on-error: true

      - name: Force Delete iOS Folder
        run: rm -rf ios

      - name: Generate Drift Code
        run: dart run build_runner build --delete-conflicting-outputs

      # ---------- ANDROID SIGNING SETUP ----------

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/blackmoon_studio_release.keystore

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=blackmoon_studio_release.keystore" >> android/key.properties

      # ---------- BUILD ----------

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dreadmoor-Game-Build
          path: build/app/outputs/flutter-apk/app-release.apk

      # ---------- CLEANUP ----------

      - name: Cleanup Keystore
        run: rm android/app/blackmoon_studio_release.keystore
