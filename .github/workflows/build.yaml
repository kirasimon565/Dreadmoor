name: Build Android

on:
  push:
    branches:
      - 'dreadmoor-init-17025123926669017520'
  pull_request:
    branches:
      - 'dreadmoor-init-17025123926669017520'
  workflow_dispatch: # CRITICAL: This adds the manual "Run" button in GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons:main
        # This builds your icon using the config in your pubspec.yaml

      - name: Generate Drift Code
        run: dart run build_runner build --delete-conflicting-outputs
        # This generates the database code for the crime story engine

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dreadmoor-Game-Build
          path: build/app/outputs/flutter-apk/app-release.apk
