name: Build Android

on:
  push:
    branches: [ "Dreadmoor-init-17025123926669017520" ]
  pull_request:
    branches: [ "Dreadmoor-init-17025123926669017520" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons:main
        # This will look for your icon configuration in pubspec.yaml 
        # and overwrite the default Flutter icons with your assets.

      - name: Generate Drift Code
        run: dart run build_runner build --delete-conflicting-outputs
        # Essential for your detective board, messages, and state persistence.

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dreadmoor-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
